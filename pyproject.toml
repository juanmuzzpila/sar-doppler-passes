[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-doppler-passes"
version = "0.1.0"
description = "SAR pass geometry and X-band Doppler history for a ground target, from real CelesTrak TLEs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "sgp4>=2.22"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sarpass = "sarpass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
