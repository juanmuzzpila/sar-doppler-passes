name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 */6 * * *"   # refresh TLEs / passes every 6 h (CelesTrak asks for >= 2 h between downloads)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Compute passes (CelesTrak, else committed TLEs, else demo)
        run: |
          if python -m sarpass --mission iceye --out docs/data/passes.json; then
            echo "Using live CelesTrak TLEs"
          elif [ -f data/iceye_tles.txt ]; then
            echo "::warning::CelesTrak unreachable, using committed TLEs in data/iceye_tles.txt"
            python -m sarpass --tle-file data/iceye_tles.txt --max-tle-age-days 3650 --out docs/data/passes.json
          else
            echo "::warning::CelesTrak unreachable and no committed TLEs, deploying synthetic demo data"
            python -m sarpass --demo --out docs/data/passes.json
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
